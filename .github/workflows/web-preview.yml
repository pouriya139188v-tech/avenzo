name: AVENZO Visual Demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/index.html'
      - '.github/workflows/web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: avenzo-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish AVENZO visual demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare demo site
        run: |
          mkdir -p dist
          cp demo/index.html dist/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
