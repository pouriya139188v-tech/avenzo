name: AVENZO Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract AVENZO source
        run: |
          unzip -q AVENZO-project-source.zip -d app-source
          APP_DIR="$(dirname "$(find app-source -name package.json -not -path '*/node_modules/*' | head -n 1)")"
          if [ -z "$APP_DIR" ] || [ "$APP_DIR" = "." ]; then
            echo "package.json was not found inside the source archive"
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm --prefix "$APP_DIR" install

      - name: Diagnose Expo configuration
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "Project files:"
          find . -maxdepth 2 -type f \( -name 'app.json' -o -name 'app.config.*' -o -name 'package.json' -o -name 'eas.json' \) -print
          echo "Expo config output:"
          npx expo config --json

      - name: Remove placeholder Expo project ID
        working-directory: ${{ env.APP_DIR }}
        run: |
          node -e 'const fs=require("fs"); const p="app.json"; if(fs.existsSync(p)){const c=JSON.parse(fs.readFileSync(p,"utf8")); if(c.expo?.extra?.eas?.projectId==="ADD_EXPO_PROJECT_ID_HERE"){delete c.expo.extra.eas.projectId; fs.writeFileSync(p, JSON.stringify(c,null,2)+"\n"); console.log("Removed placeholder Expo project ID");}}'

      - name: Initialize EAS project if needed
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest project:init --non-interactive

      - name: Build APK on EAS
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
